spring:
  application:
    name: cloud-eureka
  profiles:
    active: dev
  config:
    import: optional:configserver:http://localhost:22001/
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
