spring:
  application:
    name: cloud-sso-client
  config:
    import: "configserver:http://localhost:22001/"    # ⚠️ 端口变更：8888 → 22001
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true
  data:
    redis:
      host: localhost
      port: 6379